<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #222; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
  .frame { position: relative; overflow: clip; }
  .desktop-frame { width: 1440px; height: 800px; }
  .mobile-frame { width: 393px; height: 762px; }
  img { display: block; }

  /* ============ DESKTOP HERO (1:1283) — faithful codegen translation ============ */
  /* Layer 1: Rectangle 42158 (bg-rect) */
  .bg-rect { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Layer 2: image 685 (road) — container 1440x810 at top 5px, child mirrored+rotated */
  .road-outer {
    position: absolute; left: 0; right: 0; top: 5px;
    aspect-ratio: 1440 / 809.9999389648438;
    display: flex; align-items: center; justify-content: center;
    container-type: size;
  }
  .road-inner {
    transform: rotate(90deg) scaleX(-1);
    flex: none; height: 100cqw; width: 100cqh;
  }
  .road-box { position: relative; width: 100%; height: 100%; }
  .road-img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-position: bottom; }
  .road-grad {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(0.7376432236689681deg, rgba(0,0,0,0) 76.305%, rgba(0,0,0,0.8) 106.49%),
      linear-gradient(269.99996835141263deg, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100.43%);
  }

  /* headline + button approx for alignment check */
  .headline-block {
    position: absolute; bottom: 60.52px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 24px; align-items: center;
  }
  .headline-block p { width: 788.543px; font: 600 48px/1.4 sans-serif; color: #fff; text-align: center; letter-spacing: -0.96px; margin: 0; }
  .btn { background: #121212; border: 0.5px solid #fff; color: #fff; font: 600 16px sans-serif; padding: 15px 24px; border-radius: 4px; }

  /* ============ MOBILE HERO (1:4524) — faithful codegen translation ============ */
  .m-base { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-position: bottom; }
  .m-grad { position: absolute; inset: 0; background: linear-gradient(to left, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100.43%); }
  .m-truck-clip { position: absolute; inset: 0; overflow: hidden; }
  .m-truck { position: absolute; top: 0; height: 100%; left: -163.32%; width: 349.01%; max-width: none; }
  .m-overlay { position: absolute; filter: blur(102.15px); top: 449.65px; left: -180.59px; height: 448.356px; width: 783.13px; }
  .m-overlay-inner { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(16px); }
  .m-content { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); width: 353px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .m-content p { font: 600 32px/1.15 sans-serif; color: #fff; width: 289px; letter-spacing: -0.64px; margin: 0; }
</style>
</head>
<body>

<div class="frame desktop-frame">
  <img class="bg-rect" src="../public/assets/hero/bg-rect.png" alt="">
  <div class="road-outer">
    <div class="road-inner">
      <div class="road-box">
        <img class="road-img" src="../public/assets/hero/road.png" alt="">
        <div class="road-grad"></div>
      </div>
    </div>
  </div>
  <div class="headline-block">
    <p>Euler Turbo EV 1000 की 180km की RealRange™ हो तो करो 1 डिलीवरी और!</p>
    <button class="btn">Explore our Vehicles →</button>
  </div>
</div>

<div class="frame mobile-frame">
  <div style="position:absolute; inset:0;">
    <img class="m-base" src="../public/assets/hero/road.png" alt="">
    <div class="m-grad"></div>
    <div class="m-truck-clip">
      <img class="m-truck" src="../public/assets/hero/truck-photo.png" alt="">
    </div>
  </div>
  
  <div class="m-content">
    <p>Euler Turbo EV 1000 की 180km की RealRange™ हो तो करो 1 डिलीवरी और!</p>
  </div>
</div>

</body>
</html>
